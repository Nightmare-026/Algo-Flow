name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: Lint, Validate, Test & Build
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder-project.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.e30.placeholder
      UPSTASH_REDIS_REST_URL: ""
      UPSTASH_REDIS_REST_TOKEN: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog Secret Scanning
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

      - name: Ensure no unapproved environment files are committed
        run: |
          if git ls-files | grep -E '^\.env' | grep -v '^\.env\.example$'; then
            echo "ERROR: Tracked .env files found! Only .env.example may be tracked."
            exit 1
          fi

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Next.js build cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('src/**/*.{js,jsx,ts,tsx}') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Dependency security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Validate SQL migration files
        run: |
          for f in supabase/migrations/*.sql; do
            [ -f "$f" ] || continue
            echo "Validating $f..."
            if [ ! -s "$f" ]; then
              echo "ERROR: Migration file $f is empty."
              exit 1
            fi
          done

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Validate algorithm registry
        run: npm run validate:registry

      - name: Validate curriculum integrity
        run: npm run validate:curriculum

      - name: Validate visualizer coordination
        run: npm run validate:visualizers:coordination

      - name: Verify code examples
        run: npm run verify:code-examples

      - name: Run unit test suite
        run: npm run test

      - name: Build production bundle
        run: npm run build
